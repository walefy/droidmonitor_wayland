[package]
name = "droidmonitor_wayland"
version = "0.1.0"
edition = "2024"
description = "Segundo monitor virtual Plug-and-Play com Multi-Touch para COSMIC Wayland + Android USB"
authors = ["Walefy"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/walefy/droidmonitor_wayland"
keywords = ["wayland", "cosmic", "android", "monitor", "touchscreen"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "droidmonitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
dirs = "6.0"
evdev = "0.12"
futures-util = "0.3"
jpeg-encoder = "0.6"
nix = { version = "0.29", features = ["fs", "mman", "signal", "user", "socket"] }
qrcode = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
